name: Test
on:
  push:
    branches-ignore: [master]
  pull_request:
  workflow_call:

jobs:
  test-image:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "8.4"
          - "8.4-dev"
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.version }}
          platforms: ${{ matrix.platform }}
          load: true
          tags: lastcallmedia/php:${{ matrix.version }}
          cache-from: type=gha,scope=${{ matrix.version }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.version }}-${{ matrix.platform }}
      - name: Unit Test Image
        uses: ./.github/actions/container-structure-test
        with:
          image: lastcallmedia/php:${{ matrix.version }}
          config: ./${{ matrix.version }}/test.yml
      - name: "Verify image starts Apache"
        run: |
          IMG=$(docker run --platform ${{ matrix.platform }} -d -p 8080:80 lastcallmedia/php:${{ matrix.version }})
          trap 'docker logs "$IMG"; docker stop "$IMG"' EXIT
          docker exec "$IMG" sh -c 'echo healthy > /var/www/html/healthcheck.txt'
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 --connect-timeout 5 --max-time 10 http://localhost:8080/healthcheck.txt
  check-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Setup dockerize
        uses: zcong1993/setup-dockerize@v1.2.2
        with:
          dockerize-version: '0.6.1'
      - name: Run regenerate
        run: ./regenerate.sh
      - name: Check diff
        run: '[[ -z $(git status --porcelain) ]] || { echo "Changes detected to template that are not reflected in the repository."; exit 1; }'
